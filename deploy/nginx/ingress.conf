# DivertLink 前置 nginx 示例（终止 TLS，纯 HTTP 回源到 http_listen）
#
# 适用拓扑：
#   公网 443 -> nginx(终止 TLS) -> DivertLink http_listen 127.0.0.1:8080
# 该模式下 gateway 的配置建议：
#   [server]
#   http_listen = "127.0.0.1:8080"      # 明文入口，只给本机 nginx 用
#   tunnel_listen = "0.0.0.0:8443"      # 同机 nginx 占用 443，agent 改连 8443
#   ingress_listen = "0.0.0.0:8443"      # 与 tunnel 共用 8443，按 ALPN 分流
# 若 nginx 与 gateway 不在同一台机器，gateway 的 tunnel_listen 可保持 443，
# 只需把下方 upstream 改为 gateway 内网地址。
#
# 安装：
#   sudo cp deploy/nginx/ingress.conf /etc/nginx/conf.d/divertlink.conf
#   # 修改 llm.example.com 与证书路径后：
#   sudo nginx -t && sudo systemctl reload nginx
#
# 防火墙只放行 443（以及 agent 直连的 tunnel 端口，如同机部署用 8443）；
# 8080/9090 保持仅回环可达。

upstream divertlink_ingress {
    server 127.0.0.1:8080;
    # 与网关保持长连接，减少大模型长请求前的握手开销
    keepalive 64;
}

# 可选：HTTP 跳转 HTTPS（若已由其它 server 统一处理可删除）
server {
    listen 80;
    listen [::]:80;
    server_name llm.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name llm.example.com;

    ssl_certificate     /etc/letsencrypt/live/llm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:divertlink_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # nginx >= 1.25.1 推荐改用 `http2 on;` 并去掉 listen 行里的 http2 参数

    # 与 server.toml 的 [limits].max_request_bytes = "64MiB" 保持一致
    client_max_body_size 64m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    location / {
        proxy_pass http://divertlink_ingress;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE / 流式响应必需：关闭所有缓冲，响应一到就下发
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;

        # 大模型长请求：与 [limits].request_timeout（10m）对齐；
        # 流式空闲由网关的 stream_idle_timeout 判定，不由 nginx 提前掐断
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 透传 Host（网关按 hosts 路由）与客户端信息（allow_ips、审计日志）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 认证头（Authorization / x-api-key）默认原样透传，无需额外设置。

        # 真实客户端 IP：gateway 默认不信任 X-Forwarded-For。若 nginx 与 gateway
        # 同机/可信，请在 server.toml 的 [server] 设置 trust_proxy = true，否则
        # allow_ips / 按 IP 限流 / 审计日志看到的都会是 127.0.0.1。
    }
}

# ------------------------------------------------------------------------------
# TLS 直通 / 共用 443 的说明（单网关场景通常不需要）
#
# 1) 推荐：网关自身单端口 ALPN 复用（tunnel_listen = ingress_listen = 0.0.0.0:443），
#    agent 用 ALPN "divertlink/1" 建隧道，HTTP 客户端用 "h2"/"http/1.1" 走入口，
#    不需要 nginx，防火墙只开 443。
#
# 2) 若 443 必须与其它网站共用，且网关必须自己终止 TLS，可用 nginx stream 模块做
#    纯 TCP 透传（nginx 不终止 TLS，ALPN 原样交给网关）。注意：nginx 的 http server
#    与 stream server 不能同时监听同一个端口，且下面配置必须写在 nginx.conf 的
#    http {} 之外（conf.d 目录内的文件位于 http 上下文，不能放 stream）：
#
#    stream {
#        upstream divertlink_tls {
#            server 127.0.0.1:8443;   # gateway 的 tunnel_listen + ingress_listen 端口
#        }
#        server {
#            listen 443;
#            ssl_preread on;          # 只读 ClientHello，不终止 TLS
#            proxy_pass divertlink_tls;
#            proxy_timeout 600s;
#        }
#    }
#
# 3) 若希望 nginx 按 SNI/ALPN 把流量分给多个后端（例如一个新站点、一个 DivertLink），
#    可用 ssl_preread + map 做分流；对 DivertLink 后端保持纯 TCP 透传即可。
#    此时代理链路的真实客户端 IP 需要额外协议（PROXY protocol）支持，
#    DivertLink 当前仅从 TCP 对端地址取 IP，因此多一层透传时 allow_ips 会失真。
# ------------------------------------------------------------------------------
