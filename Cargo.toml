[package]
name = "divertlink"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "DivertLink - a secure, high-performance LLM reverse tunnel for exposing home-hosted models behind a fixed public IP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/divertlink/divertlink"
readme = "README.md"
keywords = ["llm", "reverse-proxy", "tunnel", "openai", "anthropic"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
axum = { version = "0.8.9", features = ["http1", "http2", "tokio", "json"] }
base64 = "0.22"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
futures-util = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
humantime = "2.4.0"
humantime-serde = "1.1.1"
hyper = { version = "1.12.0", features = ["server", "http1", "http2", "client"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["ring", "http1", "http2", "webpki-roots", "logging", "tls12"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http1", "http2", "server-auto", "service"] }
ipnet = "2.12.2"
rand = "0.8"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.16.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
socket2 = { version = "0.6.5", features = ["all"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-util = { version = "0.7.20", features = ["compat", "rt"] }
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
webpki-roots = "1.0.12"
x509-parser = "0.18"
yamux = "0.14"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
